# PrintKu — Docker Compose (backend Go + frontend SvelteKit + Redis).
# Jalankan: docker compose up --build
# Frontend: http://localhost:5173  |  API: http://localhost:8080

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: production
      DATABASE_PATH: /app/data/printku.db
      UPLOAD_DIR: /app/uploads
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-ganti_dengan_secret_yang_kuat_printku_2024}
      JWT_EXPIRES_IN: 24h
      PAYMENT_PROVIDER: midtrans-sandbox
      PAYMENT_IS_PRODUCTION: "false"
      CORS_ORIGIN: http://localhost:5173
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@printku.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
  redis_data:
